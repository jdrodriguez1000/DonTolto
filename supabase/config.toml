# Supabase Local Development Configuration
# Proyecto: DonTolto — Simulación y Analítica Predictiva para Baloto/Revancha
# Trazabilidad: TSK-F1_1.1-01.1 / SPEC-f1-1.1-AUTH-017
# Ref: docs/f1_1.1/f1_1.1_spec.md §3.1 | docs/f1_1.1/f1_1.1_plan.md B0, B4
#
# INVARIANTE: Este archivo gobierna el entorno local de Supabase CLI.
# Los cambios deben estar vinculados a un requerimiento técnico del SDD.
#
# CORRECCIÓN TSK-F1_1.1-03.3: Ajuste de claves inválidas para CLI v2.89.0
#   - [project] → project_id (top-level, CLI v2 schema)
#   - [db].extra_search_path → eliminado (no soportado en sección [db])
#   - [db.settings].cron.max_running_jobs → eliminado (no soportado en v2.89.0)

# =============================================================================
# PROYECTO
# =============================================================================
project_id = "dontolto"

# =============================================================================
# API (PostgREST)
# =============================================================================
[api]
enabled = true
# Puerto para el servidor PostgREST local
port = 54321
# Esquemas expuestos vía PostgREST. Solo 'public' y 'graphql_public'.
schemas = ["public", "graphql_public"]
# Esquemas con acceso adicional de lectura para roles anon y authenticated.
# Restringido al mínimo autorizado por SPEC §3.1 para prevenir search_path hijacking.
extra_search_path = ["public", "extensions"]
# Máximo de filas retornadas por defecto.
max_rows = 1000

# =============================================================================
# BASE DE DATOS
# =============================================================================
[db]
# Puerto local para la instancia PostgreSQL 16.
port = 54322
# Puerto de pool para conexiones en modo shadow.
shadow_port = 54320
# Versión mayor de PostgreSQL (debe ser >= 15 según PLAN B0).
major_version = 15

# =============================================================================
# POOL DE CONEXIONES (PgBouncer)
# =============================================================================
[db.pooler]
enabled = false
# Puerto del pool (expuesto externamente).
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

# =============================================================================
# MIGRACIONES
# =============================================================================
[db.migrations]
enabled = true
schema_paths = []

# =============================================================================
# SEED
# =============================================================================
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# =============================================================================
# REALTIME
# =============================================================================
[realtime]
enabled = true

# =============================================================================
# STUDIO (Dashboard de administración local)
# =============================================================================
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

# =============================================================================
# INBUCKET (Servidor de email de prueba)
# =============================================================================
[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

# =============================================================================
# ALMACENAMIENTO (Storage)
# =============================================================================
[storage]
enabled = true
file_size_limit = "50MiB"

# =============================================================================
# AUTENTICACIÓN
# =============================================================================
[auth]
enabled = true
# URL base del sitio (requerida para redirects OAuth).
site_url = "http://127.0.0.1:3000"
# URLs adicionales permitidas para redirect tras login.
additional_redirect_urls = ["https://127.0.0.1:3000"]
# Tiempo de vida del JWT en segundos (3600 = 1 hora).
jwt_expiry = 3600
# Habilitar rotación de refresh tokens.
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Deshabilitar registro de nuevos usuarios (solo Admin creado manualmente).
enable_signup = false
# Deshabilitar sign-ins anónimos.
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = ""

[auth.email]
# Deshabilitar registro por correo en entorno local (solo Admin).
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false

# =============================================================================
# EDGE FUNCTIONS
# =============================================================================
[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# =============================================================================
# ANÁLISIS / VECTOR
# =============================================================================
[analytics]
enabled = false
port = 54327
backend = "postgres"
